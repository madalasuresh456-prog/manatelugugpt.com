<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mana Telugu GPT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#212121;color:#ececec;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column}header{padding:12px 16px;background:#171717;border-bottom:1px solid #2f2f2f;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}.logo{width:30px;height:30px;background:#fff;border-radius:50%;display:grid;place-items:center;color:#000;font-weight:900}.t{font-size:14px;font-weight:700}.s{font-size:10px;opacity:.5}.chat{flex:1;max-width:780px;width:100%;margin:0 auto;padding-bottom:140px}.msg{padding:18px 16px;display:flex;gap:12px;border-bottom:1px solid #ffffff08}.av{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;font-size:11px;font-weight:700}.u .av{background:#5436DA;color:#fff}.b .av{background:#19c37d;color:#fff}.tx{flex:1;line-height:1.75;font-size:14.5px;white-space:pre-wrap}.tx b{color:#fff}.wel{padding:40px 20px;text-align:center}.qs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px;margin:20px auto}.qs button{padding:8px 12px;border-radius:20px;border:1px solid #333;background:#222;color:#ddd;font-size:11px;cursor:pointer}.inp{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px 14px;border-top:1px solid #222}.box{max-width:780px;margin:0 auto;background:#1e1e1e;border-radius:28px;display:flex;align-items:center;padding:5px 5px 5px 16px;gap:8px}.box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:14px;padding:7px 0}.box button{width:30px;height:30px;border-radius:50%;border:none;background:#fff;color:#000;cursor:pointer}</style></head><body><header><div class="logo">తె</div><div><div class="t">మన తెలుగు GPT</div><div class="s">Free • Fast • ChatGPT Clone</div></div></header><div class="chat" id="chat"><div class="wel" id="wel"><h2>నమస్తే మామా! 🙏</h2><p style="opacity:.6;font-size:13px">ChatGPT la em adigina free ga!</p><div class="qs"><button onclick="ask('UPSC ఎలా ప్రిపేర్ అవ్వాలి')">📚 UPSC</button><button onclick="ask('బిర్యానీ రెసిపీ')">🍛 బిర్యానీ</button><button onclick="ask('బ్లాక్ హోల్ అంటే ఏమిటి')">🌌 Black Hole</button><button onclick="ask('పైథాన్ నేర్చుకోవడం ఎలా')">💻 Python</button></div></div></div><div class="inp"><div class="box"><input id="inp" placeholder="Adugu mama..."><button onclick="send()">↑</button></div></div><script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),wel=document.getElementById('wel');
function ask(t){inp.value=t;send()}
function add(r,t,h){let d=document.createElement('div');d.className='msg '+r;d.innerHTML=`<div class="av">${r==='u'?'M':'AI'}</div><div class="tx">${h?t:t.replace(/</g,'&lt;')}</div>`;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d.querySelector('.tx');}
function cleanFormat(txt){
// Remove markdown junk
return txt.replace(/---/g,'').replace(/\|.*\|/g,'').replace(/##\s*\d*\.?\s*/g,'<br><br><b>👉 ').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
async function send(){
let q=inp.value.trim();if(!q)return;
if(wel)wel.style.display='none';
add('u',q,false);inp.value='';
let bot=add('b','⚡ Alachistunna mama...',true);
try{
let prompt=encodeURIComponent(`You are Mana Telugu GPT. Answer ONLY in Telugu language (Telugu script). Use simple formatting, no markdown tables, no | symbols, no ## symbols. Use only bold for headings and bullet points with •. Question: ${q}. Give detailed ChatGPT style answer in Telugu, friendly, use mama sometimes.`);
let res=await fetch(`https://text.pollinations.ai/${prompt}?model=openai`,{cache:'no-store'});
let ans=await res.text();
if(!ans||ans.length<15) throw 0;
bot.innerHTML=cleanFormat(ans);
}catch(e){bot.innerHTML=`Mama network busy mama! Malli "${q}" ani adugu - pakka vasthundi! 🚀`;}
window.scrollTo(0,document.body.scrollHeight);
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
