<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mana Telugu GPT - Universal Free AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#ececec;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;background:#171717;border-bottom:1px solid #2f2f2f;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:32px;height:32px;background:#fff;border-radius:50%;display:grid;place-items:center;color:#000;font-weight:900}
.title{font-size:14px;font-weight:700}.sub{font-size:11px;opacity:.5}
.chat{flex:1;max-width:780px;width:100%;margin:0 auto;padding-bottom:140px}
.msg{padding:20px 16px;display:flex;gap:12px;border-bottom:1px solid #ffffff08}
.av{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:grid;place-items:center;font-size:12px;font-weight:700}
.user .av{background:#5436DA;color:#fff}.bot .av{background:#19c37d;color:#fff}
.txt{flex:1;line-height:1.8;font-size:15px;white-space:pre-wrap;word-break:break-word}
.welcome{padding:60px 20px;text-align:center}
.welcome h2{font-size:28px;margin-bottom:10px}
.welcome p{opacity:.6;font-size:14px}
.qs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px;margin:24px auto}
.qs button{padding:9px 14px;border-radius:20px;border:1px solid #3a3a3a;background:#2f2f2f;color:#ececec;font-size:12px;cursor:pointer}
.input-area{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:14px 16px;border-top:1px solid #2f2f2f}
.input-box{max-width:780px;margin:0 auto;background:#2f2f2f;border-radius:28px;display:flex;align-items:center;padding:6px 6px 6px 18px;gap:8px;border:1px solid #444}
.input-box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px;padding:8px 0}
.input-box button{width:32px;height:32px;border-radius:50%;border:none;background:#fff;color:#000;cursor:pointer;font-weight:700}
.typing span{animation:blink 1.4s infinite;opacity:.2}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<header>
<div class="logo">తె</div>
<div><div class="title">మన తెలుగు GPT - Universal</div><div class="sub">Free for Everyone • Em adigina chepthundi • 100% Telugu</div></div>
</header>

<div class="chat" id="chat">
<div class="welcome" id="wel">
<h2>నమస్తే మామా! 🙏</h2>
<p>నేను నీ Universal ChatGPT ని - <b>ఎవరు ఏది అడిగినా</b> FREE గా తెలుగులో చెప్తా!</p>
<div class="qs">
<button onclick="ask('బ్లాక్ హోల్ అంటే ఏమిటి వివరంగా చెప్పు')">🌌 బ్లాక్ హోల్</button>
<button onclick="ask('చంద్రయాన్ 3 గురించి చెప్పు')">🚀 చంద్రయాన్</button>
<button onclick="ask('పైథాన్ లో calculator ఎలా చేయాలి')">💻 కోడింగ్</button>
<button onclick="ask('అమ్మాయి నచ్చింది ఎలా చెప్పాలి')">❤️ ప్రేమ</button>
<button onclick="ask('బిర్యానీ రెసిపీ చెప్పు')">🍛 బిర్యానీ</button>
<button onclick="ask('UPSC ఎలా ప్రిపేర్ అవ్వాలి')">📚 UPSC</button>
</div>
</div>
</div>

<div class="input-area">
<div class="input-box">
<input id="inp" placeholder="Em adigina adugu mama - free answer!">
<button onclick="send()">↑</button>
</div>
<p style="text-align:center;font-size:10px;opacity:.3;margin-top:8px">Free AI for Telugu People • No API Key • Unlimited</p>
</div>

<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const wel=document.getElementById('wel');

function ask(t){inp.value=t;send()}

function add(role, text, isHTML){
let div=document.createElement('div');
div.className='msg '+role;
div.innerHTML=`<div class="av">${role==='user'?'M':'AI'}</div><div class="txt">${isHTML?text:text.replace(/</g,'&lt;')}</div>`;
chat.appendChild(div);
window.scrollTo(0,document.body.scrollHeight);
return div.querySelector('.txt');
}

// MAIN UNIVERSAL AI FUNCTION - FREE FOR ALL
async function getAIAnswer(question){
let systemPrompt = `You are Mana Telugu GPT - You are exactly like ChatGPT but you answer in Telugu language. You are helpful, friendly, you call user 'mama' sometimes. Answer in Telugu script mainly, mix English for technical words. Give detailed, useful answer like ChatGPT. User asked: ${question}. Answer in Telugu.`;

let encodedPrompt = encodeURIComponent(systemPrompt);

// 3 FREE APIs - try one by one (all free, no key)
let apis = [
`https://text.pollinations.ai/${encodedPrompt}?model=openai`,
`https://text.pollinations.ai/${encodedPrompt}?model=openai-large`,
`https://api.duckduckgo.com/?q=${encodedPrompt}&format=json`
];

for(let url of apis){
try{
let res = await fetch(url, {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
let txt = await res.text();
if(txt && txt.length > 30 && !txt.includes('"error"') && !txt.includes('Model not found')){
return txt;
}
}catch(e){ continue; }
}
return null;
}

async function send(){
let q=inp.value.trim(); if(!q) return;
if(wel) wel.style.display='none';
add('user', q, false);
inp.value='';
let botEl = add('bot', '<span class="typing"><span>●</span> <span>●</span> <span>●</span> ChatGPT alochistundi mama...</span>', true);

try{
let answer = await getAIAnswer(q);
if(!answer) throw new Error('no answer');

let formatted = answer
.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
.replace(/\n\n/g,'<br><br>')
.replace(/\n/g,'<br>');

botEl.innerHTML = formatted;

}catch(e){
// If all APIs fail - show helpful message but still useful
botEl.innerHTML = `🙏 మామా, <b>"${q}"</b> గురించి network slow valla answer raledu mama!<br><br>
<b>Malli try chey mama - 1 sec lo vasthundi!</b><br><br>
Tip: Refresh chesi malli adugu mama - free API kabatti konchem slow avthundi kani pakka vasthundi! 🚀`;
}
window.scrollTo(0,document.body.scrollHeight);
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
