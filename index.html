<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana Telugu GPT - మన తెలుగు GPT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:white}
.header{text-align:center;padding:25px 15px;background:rgba(0,0,0,0.3)}
.header h1{font-size:32px;font-weight:900;background:linear-gradient(90deg,#ff8a00,#e52e71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.header p{font-size:18px;opacity:0.9}
.container{max-width:500px;margin:0 auto;padding:15px}
.chat-box{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border-radius:25px;padding:15px;min-height:65vh;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,0.15)}
.messages{flex:1;overflow-y:auto;max-height:55vh;padding:10px}
.msg{margin:12px 0;padding:18px 20px;border-radius:22px;font-size:17px;line-height:1.5;animation:slide 0.3s}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.user{background:linear-gradient(135deg,#667eea,#764ba2);margin-left:30px;border-bottom-right-radius:6px;font-weight:600}
.bot{background:rgba(255,255,255,0.12);margin-right:30px;border-bottom-left-radius:6px;border:1px solid rgba(255,255,255,0.1)}
.input-area{display:flex;gap:10px;margin-top:15px;background:rgba(0,0,0,0.3);padding:10px;border-radius:30px;border:1px solid rgba(255,255,255,0.15)}
.input-area input{flex:1;background:transparent;border:none;color:white;font-size:18px;padding:12px 15px;outline:none}
.input-area input::placeholder{color:rgba(255,255,255,0.6);font-size:16px}
.input-area button{background:linear-gradient(135deg,#ff8a00,#e52e71);border:none;width:55px;height:55px;border-radius:50%;font-size:26px;cursor:pointer;transition:0.2s}
.input-area button:active{transform:scale(0.9)}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.quick-btns button{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:white;padding:10px 16px;border-radius:20px;font-size:14px;cursor:pointer}
.footer{text-align:center;padding:20px;font-size:13px;opacity:0.6}
</style>
</head>
<body>
<div class="header">
<h1>మన తెలుగు GPT 🇮🇳</h1>
<p>Mana Telugu GPT - Mee Kosam</p>
</div>
<div class="container">
<div class="quick-btns">
<button onclick="ask('Telugu lo oka manchi katha cheppu')">📖 Katha</button>
<button onclick="ask('Roju oka manchi maata cheppu')">💡 Suvachanam</button>
<button onclick="ask('Telugu vantalu gurinchi cheppu')">🍛 Vantalu</button>
<button onclick="ask('Telugu samethalu cheppu')">🗣️ Samethalu</button>
</div>
<div class="chat-box">
<div class="messages" id="msgs">
